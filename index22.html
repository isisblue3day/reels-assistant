<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人與地球優選市集 | Reels AI 內容助理 v4.2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }
        
        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            flex: none;
        }
        
        .output-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .output-box.empty {
            color: #999;
            font-style: italic;
        }
        
        .status {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .partners-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .partner-chip {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .partner-chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .partner-chip.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 20px;
            }
        }
        
        .api-config {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
        }
        
        .api-config-title {
            font-weight: 600;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .api-status {
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
            background: #e8f5e9;
            color: #2e7d32;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 人與地球優選市集</h1>
            <p>Reels AI 內容助理 v4.2 — 365天自動化內容生成</p>
        </div>
        
        <div class="main-content">
            <!-- 左側：設定面板 -->
            <div class="panel">
                <div class="panel-title">⚙️ 內容設定</div>
                
                <div class="api-config">
                    <div class="api-config-title">📡 系統狀態</div>
                    <div id="apiStatus" class="api-status">✅ 本地生成模式就緒（無需 API Key）</div>
                </div>
                
                <div class="form-group">
                    <label>選擇內容類型</label>
                    <select id="contentType">
                        <option value="reels">Reels 短影片文案</option>
                        <option value="post">Instagram 貼文</option>
                        <option value="story">Story 互動貼文</option>
                        <option value="newsletter">電子報內容</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>選擇內容主軸</label>
                    <div class="partners-grid" id="pillarsGrid"></div>
                </div>
                
                <div class="form-group">
                    <label>選擇夥伴故事</label>
                    <div class="partners-grid" id="partnersGrid"></div>
                </div>
                
                <div class="form-group">
                    <label>生成天數</label>
                    <select id="daysRange">
                        <option value="7">7 天</option>
                        <option value="14">14 天</option>
                        <option value="30">30 天</option>
                        <option value="365">365 天（全年）</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>自訂主題（選填）</label>
                    <textarea id="customTheme" placeholder="輸入特定主題或活動名稱..."></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" id="generateBtn" onclick="generateContent()">
                        <span id="btnText">🚀 生成內容</span>
                    </button>
                    <button class="btn-secondary btn-small" onclick="clearAll()">重設</button>
                </div>
            </div>
            
            <!-- 右側：輸出面板 -->
            <div class="panel">
                <div class="panel-title">📝 生成結果</div>
                
                <div id="statusMessage"></div>
                
                <div id="outputBox" class="output-box empty">
                    選擇設定後按「生成內容」開始...
                </div>
                
                <div class="button-group">
                    <button class="btn-secondary" onclick="copyOutput()">📋 複製內容</button>
                    <button class="btn-secondary" onclick="exportCSV()">📊 匯出 CSV</button>
                    <button class="btn-secondary" onclick="downloadJSON()">💾 下載 JSON</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ===== 內容資料庫 =====
        const pillars = [
            { id: 'impact', name: '🌱 社會影響', color: '#4CAF50' },
            { id: 'sustainability', name: '♻️ 環境永續', color: '#2196F3' },
            { id: 'dei', name: '👥 多元共融', color: '#FF9800' },
            { id: 'shopping', name: '🛍️ 友善消費', color: '#E91E63' },
            { id: 'partner', name: '🤝 夥伴故事', color: '#9C27B0' },
            { id: 'event', name: '🎉 活動推廣', color: '#F44336' }
        ];
        
        const partners = [
            {
                id: 'kenna',
                name: '台灣肯納自閉症基金會',
                story: '透過手作與就業機會，幫助自閉症青年展現專長、創造自信。',
                products: ['手作糕點', '咖啡體驗工作坊'],
                values: ['友善職場', '身心障礙支持'],
                shortName: '肯納'
            },
            {
                id: 'coffee',
                name: '咖啡有的社會設計',
                story: '以精品手沖與情緒覺察結合，創造陪伴與療癒的時光。',
                products: ['精品咖啡', '心靈工作坊'],
                values: ['心理健康', '社會設計'],
                shortName: '咖啡有的'
            },
            {
                id: 'tongniao',
                name: '彤鳥社會企業',
                story: '以友善畜產方式，提供高品質滋補商品支持永續農業。',
                products: ['滴雞精', '土雞商品'],
                values: ['友善畜產', '永續農業'],
                shortName: '彤鳥'
            },
            {
                id: 'green',
                name: '綠色冀泉社會企業',
                story: '從植樹到產品，致力於環境永續與社區發展的循環經濟模式。',
                products: ['擴香原木', '植樹專案'],
                values: ['環境永續', '循環經濟'],
                shortName: '綠色冀泉'
            },
            {
                id: 'rongguang',
                name: '容廣心社會企業',
                story: '支持弱勢族群就業，透過手作商品創造社會共融的空間。',
                products: ['手工禮盒', '烘焙商品'],
                values: ['就業支持', '社會共融'],
                shortName: '容廣心'
            },
            {
                id: 'taoyuan',
                name: '桃園市關懷弱勢慈善協會',
                story: '長期關懷桃園弱勢家庭，透過溫暖的手作傳遞希望與陪伴。',
                products: ['手作點心', '中秋禮盒'],
                values: ['社區關懷', '弱勢支持'],
                shortName: '關懷弱勢'
            }
        ];
        
        // ===== 月份時事資料庫 =====
        const monthlyEvents = {
            1: ['新年願景', '永續目標制定', '春節準備'],
            2: ['情人節關係', '元宵文化', '社區陪伴'],
            3: ['婦女節與性別平等', '植樹節', '春季戶外'],
            4: ['清明傳統', '兒童節教育', '春季環保'],
            5: ['母親節與家庭', '勞動節', '永續發展'],
            6: ['父親節', '端午文化', '環境教育'],
            7: ['暑期學習', '社區服務', '環保月'],
            8: ['社企月', '永續倡議', '青年創業'],
            9: ['中秋團圓', '新學期', '秋季收穫'],
            10: ['雙十節', '消費者月', '秋季購物'],
            11: ['感恩節', '社企週', '年末回顧'],
            12: ['聖誕溫暖', '年末反思', '新年準備']
        };
        
        // ===== 內容模板庫（用於本地生成，不需要 API）=====
        const contentTemplates = {
            reels: [
                '今天和${partner}一起分享友善消費的力量。每一次購買都是支持，都是改變。${event}時節，我們邀請您成為影響力的推手！',
                '你知道嗎？${partner}透過${value}支持著桃園的${community}。加入「人與地球優選市集」，讓每次消費都能創造實質影響力。',
                '${partner}的故事告訴我們，社會企業不只能營利，更能創造永續的未來。這${event}，支持友善消費就是支持改變。',
                '中央大學影響力中心與${partner}攜手推動DEI多元共融。在「人與地球優選市集」，你的選擇就是投票。',
                '${event}到來，是時候重新思考消費的意義。${partner}邀請你一起，用行動支持永續、友善與共融。'
            ],
            post: [
                '【${partner}故事分享】\n\n${story}\n\n中央大學亞洲影響力中心與${partner}合作，透過「人與地球優選市集」線上平台，讓每一筆消費都能支持社會企業的永續發展。${event}時節，邀請你一起用友善消費創造影響力。',
                '感謝${partner}的堅持，讓我們看見社會企業如何在${value}的路上持續前進。這個${event}，與我們一起支持友善選品，成為改變的力量。',
                '${partner}透過${value}守護著我們的未來。在「人與地球優選市集」平台上，你可以直接支持他們的努力，讓每次消費都更有意義。',
                '多元共融、環境永續、社會影響力──這些不只是標語，${partner}正在用行動詮釋它們。加入我們，一起實踐友善消費的承諾。'
            ],
            story: [
                '你有認識的社會企業或友善品牌嗎？在「人與地球優選市集」分享你的選擇吧！💚',
                '這個${event}，你最想支持的是哪個友善品牌？投票表情符號給予支持！👇',
                '${partner}推出了新的${product}！有人想試試看嗎？在留言區分享你的想法！✨',
                '中央大學與${partner}合作推動友善消費。你也想加入嗎？按讚分享，一起創造影響力！'
            ],
            newsletter: [
                '【影響力市集通訊】\n\n親愛的朋友，\n\n這個${event}，「人與地球優選市集」帶來${partner}的故事。${story}透過平台上的友善選品，你的每次購買都能支持這份堅持。\n\n立即探索市集，發現更多改變世界的夥伴。\n\n中央大學亞洲影響力衡量與管理研究總中心',
                '【市集推薦】${partner}新品上市！\n\n${story}\n\n在「人與地球優選市集」線上購物平台上，你可以找到來自各個社會企業與公益團體的友善選品。這${event}，支持永續、多元與共融。\n\n▶ 前往市集探索：[連結]'
            ]
        };
        
        let selectedPillars = [];
        let selectedPartners = [];
        let generatedContent = [];
        
        // ===== 初始化 =====
        function init() {
            renderPillars();
            renderPartners();
        }
        
        function renderPillars() {
            const grid = document.getElementById('pillarsGrid');
            grid.innerHTML = pillars.map(p => `
                <div class="partner-chip" onclick="togglePillar('${p.id}')">
                    ${p.name}
                </div>
            `).join('');
        }
        
        function renderPartners() {
            const grid = document.getElementById('partnersGrid');
            grid.innerHTML = partners.map(p => `
                <div class="partner-chip" onclick="togglePartner('${p.id}')">
                    ${p.name}
                </div>
            `).join('');
        }
        
        function togglePillar(id) {
            const idx = selectedPillars.indexOf(id);
            if (idx > -1) {
                selectedPillars.splice(idx, 1);
            } else {
                selectedPillars.push(id);
            }
            updatePillarUI();
        }
        
        function togglePartner(id) {
            const idx = selectedPartners.indexOf(id);
            if (idx > -1) {
                selectedPartners.splice(idx, 1);
            } else {
                selectedPartners.push(id);
            }
            updatePartnerUI();
        }
        
        function updatePillarUI() {
            document.querySelectorAll('#pillarsGrid .partner-chip').forEach((chip, idx) => {
                if (selectedPillars.includes(pillars[idx].id)) {
                    chip.classList.add('selected');
                } else {
                    chip.classList.remove('selected');
                }
            });
        }
        
        function updatePartnerUI() {
            document.querySelectorAll('#partnersGrid .partner-chip').forEach((chip, idx) => {
                if (selectedPartners.includes(partners[idx].id)) {
                    chip.classList.add('selected');
                } else {
                    chip.classList.remove('selected');
                }
            });
        }
        
        // ===== 主要生成邏輯 =====
        async function generateContent() {
            const contentType = document.getElementById('contentType').value;
            const daysRange = parseInt(document.getElementById('daysRange').value);
            const customTheme = document.getElementById('customTheme').value;
            
            if (selectedPillars.length === 0 && selectedPartners.length === 0) {
                showStatus('請至少選擇一個內容主軸或夥伴故事', 'error');
                return;
            }
            
            showStatus('正在生成內容，請稍候...', 'loading');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('btnText').innerHTML = '<span class="loading-spinner"></span>生成中...';
            
            try {
                generatedContent = [];
                const today = new Date();
                
                for (let day = 0; day < daysRange; day++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() + day);
                    const month = date.getMonth() + 1;
                    const monthEvent = monthlyEvents[month][Math.floor(Math.random() * monthlyEvents[month].length)];
                    
                    // 自動均衡內容主軸
                    const selectedPillar = selectedPillars.length > 0 
                        ? selectedPillars[day % selectedPillars.length]
                        : pillars[day % pillars.length].id;
                    
                    // 自動選擇夥伴
                    const selectedPartner = selectedPartners.length > 0
                        ? selectedPartners[day % selectedPartners.length]
                        : partners[day % partners.length].id;
                    
                    const partnerData = partners.find(p => p.id === selectedPartner);
                    const pillarData = pillars.find(p => p.id === selectedPillar);
                    
                    // 本地生成內容（無需 API）
                    const content = generateLocal(contentType, partnerData, pillarData, monthEvent, customTheme);
                    
                    generatedContent.push({
                        date: date.toISOString().split('T')[0],
                        type: contentType,
                        pillar: pillarData.name,
                        partner: partnerData.name,
                        content: content
                    });
                    
                    // 進度更新
                    if (day % Math.max(1, Math.floor(daysRange / 10)) === 0) {
                        const progress = Math.round((day + 1) / daysRange * 100);
                        showStatus(`生成進度: ${progress}% (${day + 1}/${daysRange})`, 'loading');
                    }
                }
                
                displayOutput();
                showStatus(`✅ 成功生成 ${generatedContent.length} 篇內容！`, 'success');
            } catch (error) {
                showStatus(`❌ 生成失敗: ${error.message}`, 'error');
                console.error(error);
            } finally {
                document.getElementById('generateBtn').disabled = false;
                document.getElementById('btnText').textContent = '🚀 生成內容';
            }
        }
        
        // 本地生成內容（不需要 API）
        function generateLocal(type, partner, pillar, event, customTheme) {
            const templates = contentTemplates[type] || contentTemplates.reels;
            const template = templates[Math.floor(Math.random() * templates.length)];
            
            let content = template
                .replace(/\$\{partner\}/g, partner.shortName || partner.name)
                .replace(/\$\{story\}/g, partner.story)
                .replace(/\$\{value\}/g, partner.values[0])
                .replace(/\$\{product\}/g, partner.products[0])
                .replace(/\$\{event\}/g, event)
                .replace(/\$\{community\}/g, '社群');
            
            if (customTheme) {
                content += `\n\n💡 ${customTheme}`;
            }
            
            return content;
        }
        
        function displayOutput() {
            const output = generatedContent.map(item => 
                `【${item.date}】${item.type.toUpperCase()}\n夥伴: ${item.partner}\n主軸: ${item.pillar}\n\n${item.content}\n${'─'.repeat(60)}\n`
            ).join('\n');
            
            const box = document.getElementById('outputBox');
            box.textContent = output;
            box.classList.remove('empty');
        }
        
        function copyOutput() {
            const output = document.getElementById('outputBox').textContent;
            if (output === '選擇設定後按「生成內容」開始...') {
                showStatus('還沒有內容可複製', 'error');
                return;
            }
            navigator.clipboard.writeText(output);
            showStatus('✅ 已複製到剪貼簿', 'success');
        }
        
        function exportCSV() {
            if (generatedContent.length === 0) {
                showStatus('還沒有內容可匯出', 'error');
                return;
            }
            
            const csv = [
                ['日期', '類型', '夥伴', '主軸', '內容'].join(','),
                ...generatedContent.map(item => [
                    item.date,
                    item.type,
                    item.partner,
                    item.pillar,
                    `"${item.content.replace(/"/g, '""')}"`
                ].join(','))
            ].join('\n');
            
            downloadFile(csv, `reels-content-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
        }
        
        function downloadJSON() {
            if (generatedContent.length === 0) {
                showStatus('還沒有內容可下載', 'error');
                return;
            }
            
            const json = JSON.stringify(generatedContent, null, 2);
            downloadFile(json, `reels-content-${new Date().toISOString().split('T')[0]}.json`, 'application/json');
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            showStatus(`✅ 已下載 ${filename}`, 'success');
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status ${type}`;
            statusEl.textContent = message;
        }
        
        function clearAll() {
            selectedPillars = [];
            selectedPartners = [];
            generatedContent = [];
            document.getElementById('contentType').value = 'reels';
            document.getElementById('daysRange').value = '7';
            document.getElementById('customTheme').value = '';
            document.getElementById('outputBox').textContent = '選擇設定後按「生成內容」開始...';
            document.getElementById('outputBox').classList.add('empty');
            document.getElementById('statusMessage').textContent = '';
            updatePillarUI();
            updatePartnerUI();
            showStatus('已重設所有設定', 'success');
        }
        
        // 頁面載入時初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
