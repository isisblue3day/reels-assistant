<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人與地球優選市集｜Reels AI 內容助理 v3</title>
  <style>
    :root{--navy:#10253f;--teal:#007f7a;--mint:#dff5ec;--cream:#f7f4ee;--ink:#17202a;--line:#dce1e4;--soft:#eef7f6;--warn:#fff3cd;--danger:#f8d7da;--gold:#e8a020}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 "Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    .app{max-width:1400px;margin:auto;padding:24px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
    .brand{display:flex;gap:12px;align-items:center}
    .mark{width:44px;height:44px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
    .brand h1{font-size:20px;margin:0;color:var(--navy)}
    .brand p{margin:0;color:#61707c;font-size:12px}
    .top-right{display:flex;gap:8px;align-items:center}
    .badge{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700}
    .badge-green{color:#05635e;background:var(--mint)}
    .layout{display:grid;grid-template-columns:340px 1fr;gap:18px}
    .panel,.workspace{background:#fff;border:1px solid var(--line);border-radius:18px}
    .panel{padding:18px;height:max-content;position:sticky;top:14px}
    .workspace{padding:22px;min-width:0}
    .panel h2,.workspace h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
    label{display:block;font-size:11px;font-weight:700;margin:12px 0 4px;color:#46545e;text-transform:uppercase;letter-spacing:.04em}
    input,textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid #cbd4d9;border-radius:9px;background:#fff;color:var(--ink)}
    input[type=password]{letter-spacing:.1em}
    textarea{min-height:68px;resize:vertical}
    .section-sep{border:0;border-top:1px solid var(--line);margin:14px 0}
    button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 13px;cursor:pointer;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
    button.secondary{background:#e5eff0;color:var(--navy)}
    button.accent{background:var(--teal);color:#fff}
    button.sm{font-size:12px;padding:5px 9px;border-radius:7px}
    button:hover{filter:brightness(.94)}
    button:disabled{opacity:.5;cursor:not-allowed}
    button.icon-btn{background:transparent;color:var(--navy);padding:6px;border-radius:8px;border:1px solid var(--line);font-size:17px}
    .buttons{display:grid;gap:7px;margin-top:16px}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
    .tab{color:#5f6b72;background:transparent;border-radius:9px 9px 0 0;font-size:13px;padding:7px 12px;cursor:pointer;border:none;font-weight:700}
    .tab.active{color:var(--teal);border-bottom:3px solid var(--teal)}
    .view{display:none}
    .view.active{display:block}
    .overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
    .metric{padding:12px;background:var(--soft);border-radius:12px}
    .metric strong{display:block;font-size:18px;color:var(--navy)}
    .metric span{font-size:11px;color:#55646d}
    .calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
    .day{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px;cursor:pointer;background:#fff;transition:box-shadow .15s}
    .day:hover,.day.selected{border-color:var(--teal);box-shadow:0 0 0 2px #d4efeb}
    .day .num{font-size:11px;color:var(--teal);font-weight:800}
    .day .date{font-size:10px;color:#77858c;margin-left:3px}
    .day h3{font-size:12px;line-height:1.35;margin:6px 0 0;color:var(--navy)}
    .empty{padding:25px;text-align:center;color:#63717a;font-size:14px}
    .alert{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
    .alert-warn{background:var(--warn);color:#7a4800;border:1px solid #ffc107}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:18px;padding:28px;max-width:500px;width:94%;max-height:90vh;overflow-y:auto}
    .modal h3{margin:0 0 16px;color:var(--navy);font-size:18px}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .key-row{display:flex;gap:6px;align-items:center}
    .key-row input{flex:1}
    .api-status{font-size:12px;padding:6px 10px;border-radius:7px;background:#f0f0f0;color:#555;margin-top:6px}
    .api-status.ok{background:#d4efeb;color:#05635e}
    .api-status.err{background:#f8d7da;color:#721c24}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}.overview{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.app{padding:12px}.calendar{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">PP</div>
      <div>
        <h1>人與地球優選市集｜Reels AI 內容助理 v3</h1>
        <p>AI 時事感知 · 30 天內容規劃 · 數據優化 · Notion 同步</p>
      </div>
    </div>
    <div class="top-right">
      <div class="badge badge-green" id="liveStatus">● 就緒</div>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <h2>帳號設定</h2>
      <label>帳號名稱</label>
      <input id="account" value="人與地球優選市集">
      <label>目標受眾</label>
      <textarea id="audience">25–45 歲重視質感、送禮心意與永續生活的都會消費者</textarea>
      <label>內容主軸</label>
      <textarea id="pillars">永續好物選品與開箱,社企品牌故事,DEI共融與支持特殊需求社群</textarea>
      <label>首發日期</label>
      <input id="startDate" type="date">
      <label>預設 CTA 關鍵字</label>
      <input id="cta" value="送禮">
      
      <hr class="section-sep">
      <div class="buttons">
        <button id="liveGenerate" class="accent">⚡ AI 時事規劃</button>
        <button id="generate" class="secondary">📋 使用內建模板</button>
        <button id="exportCSV" class="secondary">↓ 匯出 CSV</button>
      </div>
    </aside>

    <section class="workspace">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">Reels 內容行事曆</h2>
        <div class="overview" style="margin:0;grid-template-columns:repeat(4,1fr);gap:8px">
          <div class="metric"><strong id="total">—</strong><span>已排定</span></div>
          <div class="metric"><strong id="frequency">—</strong><span>頻率</span></div>
          <div class="metric"><strong id="time">20:30</strong><span>主時段</span></div>
          <div class="metric"><strong id="festivalCount">—</strong><span>節慶</span></div>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab active" data-view="calendar">📅 內容日曆</button>
        <button class="tab" data-view="schedule">🗓 發布排程</button>
      </nav>

      <div id="calendar" class="view active">
        <div class="calendar" id="calendarGrid">
          <div class="empty" style="grid-column:1/-1">點選左側按鈕生成內容行事曆</div>
        </div>
      </div>

      <div id="schedule" class="view">
        <div class="empty">尚未生成內容</div>
      </div>
    </section>
  </div>
</main>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ API 設定</h3>
    <div class="alert alert-warn">API Key 儲存於瀏覽器 localStorage</div>
    
    <label>選擇 AI 供應商</label>
    <select id="aiProvider" style="margin-bottom:8px">
      <option value="gemini">Google Gemini（推薦）</option>
      <option value="openai">OpenAI GPT-4o</option>
    </select>

    <div id="geminiSection">
      <label>Gemini API Key</label>
      <div class="key-row">
        <input type="password" id="geminiKey" placeholder="AIza... 或 AQ...">
        <button class="secondary sm" type="button" id="toggleGeminiKey">👁</button>
      </div>
      <div id="geminiKeyStatus" class="api-status">未設定</div>
    </div>

    <div id="openaiSection" style="display:none">
      <label>OpenAI API Key</label>
      <div class="key-row">
        <input type="password" id="openaiKey" placeholder="sk-...">
        <button class="secondary sm" type="button" id="toggleOpenaiKey">👁</button>
      </div>
      <div id="openaiKeyStatus" class="api-status">未設定</div>
    </div>

    <hr class="section-sep">
    <div class="modal-footer">
      <button class="secondary" id="settingsCancel" type="button">取消</button>
      <button id="settingsSave" type="button">💾 儲存</button>
    </div>
  </div>
</div>

<script>
// 全域狀態
const state = {
  posts: [],
  selected: 0,
  mode: 'idle'
};

// 工具函式
const $ = id => document.getElementById(id);
const val = id => {
  const el = $(id);
  return el ? el.value.trim() : '';
};

// 設定管理
function loadSettings() {
  const provider = localStorage.getItem('ai_provider') || 'gemini';
  $('aiProvider').value = provider;
  
  $('geminiKey').value = localStorage.getItem('gemini_key') || '';
  $('openaiKey').value = localStorage.getItem('openai_key') || '';
  
  toggleProviderUI();
  updateGeminiKeyStatus();
  updateOpenaiKeyStatus();
}

function saveSettings() {
  const provider = $('aiProvider').value;
  localStorage.setItem('ai_provider', provider);
  
  const geminiKey = val('geminiKey');
  const openaiKey = val('openaiKey');
  
  if (geminiKey) localStorage.setItem('gemini_key', geminiKey);
  if (openaiKey) localStorage.setItem('openai_key', openaiKey);
  
  updateGeminiKeyStatus();
  updateOpenaiKeyStatus();
  
  alert('設定已儲存');
  $('settingsModal').classList.remove('open');
}

// API Key 驗證
function updateGeminiKeyStatus() {
  const keyEl = $('geminiKey');
  const statusEl = $('geminiKeyStatus');
  const key = val('geminiKey');
  
  if (!key) {
    statusEl.textContent = '未設定';
    statusEl.className = 'api-status';
  } else {
    const isValid = (key.startsWith('AIza') || key.startsWith('AQ')) && key.length >= 20;
    statusEl.textContent = isValid ? `✅ 已設定（${key.slice(0, 8)}...）` : '❌ 格式不正確';
    statusEl.className = `api-status ${isValid ? 'ok' : 'err'}`;
  }
}

function updateOpenaiKeyStatus() {
  const statusEl = $('openaiKeyStatus');
  const key = val('openaiKey');
  
  if (!key) {
    statusEl.textContent = '未設定';
    statusEl.className = 'api-status';
  } else {
    const isValid = key.startsWith('sk-') && key.length >= 20;
    statusEl.textContent = isValid ? `✅ 已設定（${key.slice(0, 8)}...）` : '❌ 格式不正確';
    statusEl.className = `api-status ${isValid ? 'ok' : 'err'}`;
  }
}

function toggleProviderUI() {
  const provider = $('aiProvider').value;
  const geminiSection = $('geminiSection');
  const openaiSection = $('openaiSection');
  
  if (provider === 'gemini') {
    geminiSection.style.display = '';
    openaiSection.style.display = 'none';
  } else {
    geminiSection.style.display = 'none';
    openaiSection.style.display = '';
  }
}

function togglePasswordVisibility(inputId) {
  const input = $(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}

// 內容生成
function runTemplateMode() {
  const startDate = val('startDate');
  if (!startDate) {
    alert('請先設定首發日期');
    return;
  }
  
  state.posts = [];
  state.mode = 'template';
  
  const start = new Date(startDate + 'T00:00:00');
  const pillars = val('pillars').split(',').map(p => p.trim()).filter(p => p);
  
  for (let i = 0; i < 30; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);
    const pillarIdx = i % (pillars.length || 1);
    
    state.posts.push({
      day: i + 1,
      date: date.toISOString().slice(0, 10),
      title: `第 ${i + 1} 天內容`,
      category: pillars[pillarIdx] || '永續好物',
      status: '模板'
    });
  }
  
  renderCalendar();
  $('liveStatus').textContent = '● 模板模式';
  alert('已生成 30 天內容日曆');
}

function runAIPlan() {
  const provider = localStorage.getItem('ai_provider') || 'gemini';
  const key = provider === 'gemini'
    ? localStorage.getItem('gemini_key')
    : localStorage.getItem('openai_key');
  
  if (!key) {
    alert('請先設定 API Key');
    $('settingsModal').classList.add('open');
    return;
  }
  
  alert('AI 功能演示中，先用範本生成');
  runTemplateMode();
}

// UI 渲染
function renderCalendar() {
  const grid = $('calendarGrid');
  
  if (state.posts.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">尚未生成內容</div>';
    return;
  }
  
  grid.innerHTML = state.posts.map((post, i) => `
    <div class="day">
      <div class="num">Day ${post.day}</div>
      <div class="date">${post.date}</div>
      <h3>${post.title}</h3>
      <div style="font-size:10px;color:#007f7a;margin-top:4px">${post.category}</div>
    </div>
  `).join('');
  
  $('total').textContent = state.posts.length;
  $('frequency').textContent = '每天 1 篇';
}

function switchView(viewName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[data-view="' + viewName + '"]').forEach(t => t.classList.add('active'));
  
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const viewEl = document.getElementById(viewName);
  if (viewEl) viewEl.classList.add('active');
}

function exportToCSV() {
  if (state.posts.length === 0) {
    alert('請先生成內容日曆');
    return;
  }
  
  const csv = [
    ['日期', '標題', '分類', '狀態'],
    ...state.posts.map(p => [p.date, p.title, p.category, p.status])
  ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `reels-${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
}

// 初始化
function init() {
  // 設定
  loadSettings();
  
  // 設定按鈕
  $('settingsBtn').addEventListener('click', function(e) {
    e.preventDefault();
    $('settingsModal').classList.add('open');
  });
  
  // 模態框
  $('settingsCancel').addEventListener('click', function(e) {
    e.preventDefault();
    $('settingsModal').classList.remove('open');
    loadSettings();
  });
  $('settingsSave').addEventListener('click', function(e) {
    e.preventDefault();
    saveSettings();
  });
  
  // 提供商選擇
  $('aiProvider').addEventListener('change', toggleProviderUI);
  
  // API Key 驗證
  $('geminiKey').addEventListener('input', updateGeminiKeyStatus);
  $('openaiKey').addEventListener('input', updateOpenaiKeyStatus);
  
  // 密碼顯示
  $('toggleGeminiKey').addEventListener('click', function(e) {
    e.preventDefault();
    togglePasswordVisibility('geminiKey');
  });
  $('toggleOpenaiKey').addEventListener('click', function(e) {
    e.preventDefault();
    togglePasswordVisibility('openaiKey');
  });
  
  // 按鈕
  $('liveGenerate').addEventListener('click', function(e) {
    e.preventDefault();
    runAIPlan();
  });
  $('generate').addEventListener('click', function(e) {
    e.preventDefault();
    runTemplateMode();
  });
  $('exportCSV').addEventListener('click', function(e) {
    e.preventDefault();
    exportToCSV();
  });
  
  // 頁籤修復（重點在這裡）
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', function(e) {
      e.preventDefault();
      const viewName = this.getAttribute('data-view');
      switchView(viewName);
    });
  });
}

// DOM 完全載入後執行
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
