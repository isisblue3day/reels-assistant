            const times = {
                0: ['09:00', '20:30'], // 星期日
                1: ['10:30', '20:30'], // 星期一
                2: ['10:30', '20:30'], // 星期二
                3: ['10:30', '20:30'], // 星期三
                4: ['10:30', '20:30'], // 星期四
                5: ['10:30', '20:30'], // 星期五
                6: ['09:00', '19:00']  // 星期六
            };
            const timeList = times[dayOfWeek];
            // 根據日期和其他因素決定發布時間
            return day % 2 === 0 ? timeList[1] : timeList[0];
        }

        // 隨機選擇函數（帶種子控制）
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // 生成內容
        function generateContent() {
            const startDate = new Date(document.getElementById('startDate').value);
            const daysCount = parseInt(document.getElementById('daysCount').value);
            const contentType = document.getElementById('contentType').value;

            // 收集選定的軸線
            const selectedAxes = [];
            for (let i = 1; i <= 6; i++) {
                if (document.getElementById(`axis${i}`).checked) {
                    const labels = ['節慶送禮', '惜食與友善農業', '消費背後的社會影響力', '企業採購與ESG', '永續好物選品與開箱', 'DEI共融與特殊需求'];
                    selectedAxes.push(labels[i-1]);
                }
            }

            // 收集選定的格式
            const selectedFormats = [];
            if (document.getElementById('format1').checked) selectedFormats.push('真人口播');
            if (document.getElementById('format2').checked) selectedFormats.push('字卡');
            if (document.getElementById('format3').checked) selectedFormats.push('動畫');

            // 收集選定的夥伴
            const selectedPartners = [];
            for (let i = 1; i <= 6; i++) {
                if (document.getElementById(`partner${i}`).checked) {
                    const labels = ['台灣肯納自閉症基金會', '咖啡有的社會設計', '彤鳥社會企業', '綠色冀泉社會企業', '容廣心社會企業', '桃園關懷弱勢慈善協會'];
                    selectedPartners.push(labels[i-1]);
                }
            }

            // 生成內容
            const contents = [];
            for (let day = 0; day < daysCount; day++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(currentDate.getDate() + day);
                
                const dateStr = currentDate.toLocaleDateString('zh-Hant-TW');
                const month = currentDate.getMonth() + 1;
                const dayOfWeek = currentDate.getDay();
                
                // AI推薦時間
                const recommendedTime = getAIRecommendedTime(day, dayOfWeek);
                
                // 隨機選擇軸線
                const seed = day * 7 + Math.floor(Math.random() * 100);
                const axisIndex = Math.floor(seededRandom(seed) * selectedAxes.length);
                const selectedAxis = selectedAxes[axisIndex];
                
                // 隨機選擇格式
                const formatIndex = Math.floor(seededRandom(seed + 1) * selectedFormats.length);
                const selectedFormat = selectedFormats[formatIndex];
                
                // 隨機選擇夥伴
                const partnerIndex = Math.floor(seededRandom(seed + 2) * selectedPartners.length);
                const selectedPartner = selectedPartners[partnerIndex];
                
                // 獲取該月的時事
                const monthEvents = monthlyEvents[month] || [];
                const eventIndex = Math.floor(seededRandom(seed + 3) * monthEvents.length);
                const selectedEvent = monthEvents[eventIndex] || '永續選品';
                
                // 獲取該軸線的內容
                const axis = contentAxes[selectedAxis];
                const hookIndex = Math.floor(seededRandom(seed + 4) * axis.hooks.length);
                const ctaIndex = Math.floor(seededRandom(seed + 5) * axis.ctas.length);
                
                const hook = axis.hooks[hookIndex];
                const cta = axis.ctas[ctaIndex];
                const hashtags = axis.hashtags;
                
                contents.push({
                    date: currentDate,
                    dateStr: dateStr,
                    day: day + 1,
                    time: recommendedTime,
                    theme: selectedEvent,
                    axis: selectedAxis,
                    format: selectedFormat,
                    partner: selectedPartner,
                    partnerInfo: partnerDatabase[selectedPartner],
                    hook: hook,
                    cta: cta,
                    hashtags: hashtags,
                    month: month,
                    dayOfWeek: dayOfWeek
                });
            }

            // 渲染各標籤頁
            renderCalendar(contents);
            renderSchedule(contents);
            renderScript(contents);
            renderEvents(contents);
            renderDrafts(contents);

            // 自動切換到日曆標籤
            document.querySelectorAll('.tab')[0].click();
        }

        // 渲染內容日曆
        function renderCalendar(contents) {
            let html = '<div class="content-grid">';
            contents.forEach(item => {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <div class="card-date">Day ${item.day} · ${item.dateStr}</div>
                                <div class="card-time">🕐 ${item.time}</div>
                            </div>
                        </div>
                        <div>
                            <span class="card-theme">${item.theme}</span>
                            <span class="card-format">${item.format}</span>
                            <div style="margin-top: 8px; font-size: 13px; color: #666;">
                                <strong>夥伴：</strong> ${item.partner}
                            </div>
                            <div class="script-section">
                                <span class="script-label">📌 黃金3秒Hook</span>
                                <div class="script-text">"${item.hook}"</div>
                                <span class="script-label">✅ 收尾CTA</span>
                                <div class="script-text">"${item.cta}"</div>
                                <span class="script-label">🔖 Hashtag</span>
                                <div class="hashtags">
                                    ${item.hashtags.map(tag => `<span class="hashtag">${tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('calendarContent').innerHTML = html;
        }

        // 渲染發布排程
        function renderSchedule(contents) {
            let html = '<table class="schedule-table"><thead><tr><th>日期</th><th>時間</th><th>主題</th><th>形式</th><th>軸線</th><th>夥伴</th></tr></thead><tbody>';
            contents.forEach(item => {
                html += `
                    <tr>
                        <td><strong>Day ${item.day}</strong> ${item.dateStr}</td>
                        <td>🕐 ${item.time}</td>
                        <td>${item.theme}</td>
                        <td>${item.format}</td>
                        <td>${item.axis}</td>
                        <td>${item.partner}</td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            document.getElementById('scheduleContent').innerHTML = html;
        }

        // 渲染腳本＋Gemini
        function renderScript(contents) {
            let html = '<div class="content-grid">';
            contents.forEach(item => {
                const geminiPrompt = `
請生成 9:16 直式 Instagram Reels 畫面，8 秒。主題：「${item.hook}」

背景與風格：台灣質感生活風格，自然光、真實人物、溫暖有情感
內容核心：${item.partner} 的 ${item.theme} 故事
視覺焦點：${item.format === '真人口播' ? '真實人物與產品互動' : item.format === '字卡' ? '清晰文字搭配視覺素材' : '動畫呈現品牌故事'}

技術要求：
- 鏡頭推鏡或動態移動（保持動感）
- 畫面中央下方預留空白供後製字幕
- 不要出現任何文字、Logo、水印、價格或錯誤包裝
- 自然材質、乾淨背景、真實台灣生活感

收尾畫面需預留空白供加入 CTA：「${item.cta}」
                `;

                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-date">Day ${item.day} · ${item.dateStr}</div>
                            <div class="card-time">🕐 ${item.time}</div>
                        </div>
                        <div style="margin-bottom: 12px;">
                            <span class="card-theme">${item.theme}</span>
                            <span class="card-format">${item.format}</span>
                        </div>
                        <div class="script-section" style="border-top: none; padding-top: 0;">
                            <span class="script-label">📌 黃金3秒Hook</span>
                            <div class="script-text">"${item.hook}"</div>
                            <span class="script-label">✅ 收尾CTA</span>
                            <div class="script-text">"${item.cta}"</div>
                            <div class="gemini-prompt">
                                <div class="gemini-header">🎬 Gemini 生成提示詞</div>
                                <div>${geminiPrompt.trim().split('\n').join('<br>')}</div>
                                <button class="btn-copy" onclick="copyToClipboard('${geminiPrompt.trim().replace(/'/g, '\\\'')}')">複製提示詞</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('scriptContent').innerHTML = html;
        }

        // 渲染本月時事
        function renderEvents(contents) {
            const monthsEvents = {};
            contents.forEach(item => {
                if (!monthsEvents[item.month]) {
                    monthsEvents[item.month] = new Set();
                }
                monthsEvents[item.month].add(item.theme);
            });

            let html = '';
            Object.keys(monthsEvents).sort((a, b) => a - b).forEach(month => {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-date">${month}月 時事與節慶</div>
                        </div>
                        <div>
                            ${Array.from(monthsEvents[month]).map(event => `<div style="padding: 8px; background: #f9f9f9; margin-bottom: 8px; border-radius: 4px; font-size: 14px;">📌 ${event}</div>`).join('')}
                        </div>
                    </div>
                `;
            });
            document.getElementById('eventsContent').innerHTML = html || '<div class="empty-state"><p>暫無時事資訊</p></div>';
        }

        // 渲染IG草稿
        function renderDrafts(contents) {
            let html = '<div class="content-grid">';
            contents.slice(0, 7).forEach(item => {
                const igCaption = `${item.hook}\n\n支持 ${item.partner}\n讓每一份選擇都成為改變的力量\n\n${item.hashtags.join(' ')}`;
                
                html += `
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <div class="card-date">Day ${item.day} · ${item.dateStr}</div>
                                <div class="card-time">🕐 ${item.time}</div>
                            </div>
                        </div>
                        <div>
                            <span class="card-format">${item.format}</span>
                            <div class="script-section">
                                <span class="script-label">📸 IG文案</span>
                                <div class="script-text" style="white-space: pre-wrap;">${igCaption}</div>
                                <div class="copy-actions">
                                    <button class="btn-copy" onclick="copyToClipboard('${igCaption.replace(/'/g, '\\\'')}')">複製貼文</button>
                                    <button class="btn-copy" onclick="copyToClipboard('${item.hashtags.join(' ')}')">複製Hashtag</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('draftsContent').innerHTML = html;
        }

        // 標籤頁切換
        function switchTab(element, tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            element.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // 複製到剪貼板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.getElementById('successMsg');
                msg.style.display = 'block';
                setTimeout(() => {
                    msg.style.display = 'none';
                }, 2000);
            });
        }

        // 匯出CSV
        function exportCSV() {
            alert('CSV匯出功能敬請期待');
        }

        // 匯出JSON
        function exportJSON() {
            alert('JSON匯出功能敬請期待');
        }

        // 初始化
        window.addEventListener('load', () => {
            const today = new Date();
            document.getElementById('startDate').valueAsDate = today;
        });
    </script>
</body>
</html>
