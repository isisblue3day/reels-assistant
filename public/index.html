<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人與地球優選市集 | Reels AI 內容助理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
            background: #e8e8e8;
            padding: 0;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            overflow-y: auto;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            flex: 1;
            overflow: auto;
        }
        
        .sidebar-section {
            margin-bottom: 25px;
        }
        
        .sidebar-title {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 8px;
            border-bottom: 2px solid #2ecc71;
        }
        
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: #666;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.1);
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            margin-top: 2px;
            width: 14px;
            height: 14px;
        }
        
        .checkbox-item label {
            cursor: pointer;
            font-size: 12px;
            color: #555;
            margin: 0;
            flex: 1;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            flex: 1;
        }
        
        .btn-primary {
            background: #2ecc71;
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #27ae60;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #3498db;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #2980b9;
        }
        
        .btn-tertiary {
            background: #ecf0f1;
            color: #333;
        }
        
        .btn-tertiary:hover {
            background: #bdc3c7;
        }
        
        .btn-small {
            padding: 8px 12px;
            font-size: 11px;
            flex: none;
        }
        
        .tab-group {
            display: flex;
            gap: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .tab {
            padding: 10px 15px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #2ecc71;
            border-bottom-color: #2ecc71;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .output-area {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
            color: #333;
        }
        
        .output-area.empty {
            color: #999;
            font-style: italic;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }
        
        .status-message {
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .content-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #2ecc71;
            padding-bottom: 8px;
            border-bottom: 2px solid #2ecc71;
        }
        
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }
            
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                padding: 15px;
            }
            
            .content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左側：設定面板 -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">📋 設定選項</div>
                
                <div class="form-group">
                    <label>內容類型 *</label>
                    <select id="contentType">
                        <option value="reels">Reels 短影片文案</option>
                        <option value="post">Instagram 貼文</option>
                        <option value="story">Story 互動貼文</option>
                        <option value="newsletter">電子報內容</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>內容主軸</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_impact" value="impact">
                            <label for="pillar_impact">社會影響</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_sustainability" value="sustainability">
                            <label for="pillar_sustainability">環境永續</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_dei" value="dei">
                            <label for="pillar_dei">多元共融</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_shopping" value="shopping">
                            <label for="pillar_shopping">友善消費</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_partner" value="partner">
                            <label for="pillar_partner">夥伴故事</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pillar_event" value="event">
                            <label for="pillar_event">活動推廣</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">🤝 夥伴選擇</div>
                
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_kenna" value="kenna">
                        <label for="partner_kenna">肯納基金會</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_coffee" value="coffee">
                        <label for="partner_coffee">咖啡有的</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_tongniao" value="tongniao">
                        <label for="partner_tongniao">彤鳥社企</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_green" value="green">
                        <label for="partner_green">綠色冀泉</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_rongguang" value="rongguang">
                        <label for="partner_rongguang">容廣心社企</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="partner_taoyuan" value="taoyuan">
                        <label for="partner_taoyuan">關懷弱勢</label>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">📅 時間設定</div>
                
                <div class="form-group">
                    <label>開始日期 *</label>
                    <input type="date" id="startDate">
                </div>
                
                <div class="form-group">
                    <label>生成天數 *</label>
                    <select id="daysRange">
                        <option value="7">7 天</option>
                        <option value="14">14 天</option>
                        <option value="30">30 天</option>
                        <option value="90">90 天</option>
                        <option value="365">365 天（全年）</option>
                    </select>
                </div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-title">✏️ 自訂內容</div>
                
                <div class="form-group">
                    <label>主題或活動名稱</label>
                    <textarea id="customTheme" placeholder="輸入特定主題或活動名稱..."></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" id="generateBtn" onclick="generateContent()">
                    生成內容
                </button>
                <button class="btn btn-tertiary btn-small" onclick="clearAll()">重設</button>
            </div>
            
            <div class="button-group">
                <button class="btn btn-tertiary btn-small" onclick="copyOutput()">📋 複製</button>
                <button class="btn btn-tertiary btn-small" onclick="exportCSV()">CSV</button>
                <button class="btn btn-tertiary btn-small" onclick="downloadJSON()">JSON</button>
            </div>
        </div>
        
        <!-- 右側：主要內容區 -->
        <div class="main">
            <div class="header">
                <h1>🌍 人與地球優選市集</h1>
                <p>Reels AI 內容助理 — 365天自動化內容生成</p>
            </div>
            
            <div class="content">
                <div class="content-section">
                    <div class="section-title">📝 生成結果</div>
                    <div id="statusMessage"></div>
                    <div id="outputBox" class="output-area empty">
選擇設定後按「生成內容」開始...
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ===== 資料庫 =====
        const partnerDatabase = {
            kenna: {
                name: '台灣肯納自閉症基金會',
                story: '透過手作與就業機會，幫助自閉症青年展現專長、創造自信。',
                products: ['手作糕點', '咖啡體驗工作坊'],
                values: ['友善職場', '身心障礙支持']
            },
            coffee: {
                name: '咖啡有的社會設計',
                story: '以精品手沖與情緒覺察結合，創造陪伴與療癒的時光。',
                products: ['精品咖啡', '心靈工作坊'],
                values: ['心理健康', '社會設計']
            },
            tongniao: {
                name: '彤鳥社會企業',
                story: '以友善畜產方式，提供高品質滋補商品支持永續農業。',
                products: ['滴雞精', '土雞商品'],
                values: ['友善畜產', '永續農業']
            },
            green: {
                name: '綠色冀泉社會企業',
                story: '從植樹到產品，致力於環境永續與社區發展的循環經濟模式。',
                products: ['擴香原木', '植樹專案'],
                values: ['環境永續', '循環經濟']
            },
            rongguang: {
                name: '容廣心社會企業',
                story: '支持弱勢族群就業，透過手作商品創造社會共融的空間。',
                products: ['手工禮盒', '烘焙商品'],
                values: ['就業支持', '社會共融']
            },
            taoyuan: {
                name: '桃園市關懷弱勢慈善協會',
                story: '長期關懷桃園弱勢家庭，透過溫暖的手作傳遞希望與陪伴。',
                products: ['手作點心', '中秋禮盒'],
                values: ['社區關懷', '弱勢支持']
            }
        };
        
        const monthlyEvents = {
            1: ['新年願景', '永續目標制定', '春節準備'],
            2: ['情人節關係', '元宵文化', '社區陪伴'],
            3: ['婦女節與性別平等', '植樹節', '春季戶外'],
            4: ['清明傳統', '兒童節教育', '春季環保'],
            5: ['母親節與家庭', '勞動節', '永續發展'],
            6: ['父親節', '端午文化', '環境教育'],
            7: ['暑期學習', '社區服務', '環保月'],
            8: ['社企月', '永續倡議', '青年創業'],
            9: ['中秋團圓', '新學期', '秋季收穫'],
            10: ['雙十節', '消費者月', '秋季購物'],
            11: ['感恩節', '社企週', '年末回顧'],
            12: ['聖誕溫暖', '年末反思', '新年準備']
        };
        
        const templates = {
            reels: [
                '中央大學影響力中心與${partner}合作，這${event}，讓每一次的友善消費都能創造實質影響。在「人與地球優選市集」，你的選擇就是改變的開始。',
                '${partner}透過${value}默默守護著我們的未來。${event}到來，是時候用行動支持他們。加入「人與地球優選市集」，成為改變的推手。',
                '你知道嗎？每一筆友善消費都有故事。${partner}的故事，正在「人與地球優選市集」等你發現。這${event}，一起支持永續。',
                '社會企業不只能營利，更能創造永續的未來。${partner}用行動詮釋著這份承諾。在「人與地球優選市集」支持他們，讓改變發生。',
                '${event}時節，是重新思考消費意義的時刻。與${partner}一起，用友善選品支持永續、多元與共融的世界。',
                '每次購買都是投票。在「人與地球優選市集」支持${partner}，就是為永續、友善與共融投下一票。'
            ],
            post: [
                '【${partner}的故事】\n\n${story}\n\n中央大學亞洲影響力中心與${partner}透過「人與地球優選市集」線上平台，致力於讓每一筆消費都能支持社會企業的永續發展。${event}到來，邀請你一起用友善消費創造影響力。',
                '感謝${partner}在${value}路上的堅持與努力。${event}時節，我們邀請你加入「人與地球優選市集」，一起支持友善選品，成為改變的力量。',
                '多元共融、環境永續、社會影響力──這些不只是標語，${partner}正在用行動詮釋它們。在「人與地球優選市集」認識他們，一起實踐友善消費的承諾。'
            ],
            story: [
                '你認識哪個社會企業或友善品牌呢？在「人與地球優選市集」分享你的故事吧！👇',
                '${event}到來，你最想支持的友善品牌是？在留言區告訴我們！💚',
                '${partner}推出新品了！有人對${product}感興趣嗎？留言分享你的想法！✨'
            ],
            newsletter: [
                '【影響力市集通訊】${event}特輯\n\n親愛的朋友，\n\n這個${event}，「人與地球優選市集」帶來${partner}的故事。${story}\n\n透過平台上的友善選品，你的每次購買都能支持這份堅持。立即探索市集，發現更多改變世界的夥伴。',
                '【市集推薦】${partner}${product}新品\n\n${story}\n\n在「人與地球優選市集」線上購物平台，你可以找到來自各個社會企業與公益團體的友善選品。'
            ]
        };
        
        let generatedContent = [];
        
        // 初始化
        function init() {
            setDefaultDate();
        }
        
        function setDefaultDate() {
            const today = new Date();
            document.getElementById('startDate').valueAsDate = today;
        }
        
        function getSelectedPillars() {
            return Array.from(document.querySelectorAll('input[id^="pillar_"]:checked')).map(e => e.value);
        }
        
        function getSelectedPartners() {
            return Array.from(document.querySelectorAll('input[id^="partner_"]:checked')).map(e => e.value);
        }
        
        function generateContent() {
            const contentType = document.getElementById('contentType').value;
            const daysRange = parseInt(document.getElementById('daysRange').value);
            const customTheme = document.getElementById('customTheme').value;
            const startDate = new Date(document.getElementById('startDate').value);
            
            const selectedPillars = getSelectedPillars();
            const selectedPartners = getSelectedPartners();
            
            if (selectedPillars.length === 0 && selectedPartners.length === 0) {
                showStatus('❌ 請至少選擇一個內容主軸或夥伴故事', 'error');
                return;
            }
            
            showStatus('⏳ 正在生成內容，請稍候...', 'loading');
            document.getElementById('generateBtn').disabled = true;
            
            setTimeout(() => {
                try {
                    generatedContent = [];
                    const templateList = templates[contentType] || templates.reels;
                    
                    for (let day = 0; day < daysRange; day++) {
                        const date = new Date(startDate);
                        date.setDate(date.getDate() + day);
                        const month = date.getMonth() + 1;
                        const monthEvent = monthlyEvents[month][Math.floor(Math.random() * monthlyEvents[month].length)];
                        
                        // 循環選擇夥伴
                        const partnerKey = selectedPartners.length > 0 
                            ? selectedPartners[day % selectedPartners.length]
                            : Object.keys(partnerDatabase)[day % Object.keys(partnerDatabase).length];
                        
                        const partner = partnerDatabase[partnerKey];
                        const template = templateList[Math.floor(Math.random() * templateList.length)];
                        
                        let content = template
                            .replace(/\$\{partner\}/g, partner.name)
                            .replace(/\$\{story\}/g, partner.story)
                            .replace(/\$\{value\}/g, partner.values[Math.floor(Math.random() * partner.values.length)])
                            .replace(/\$\{product\}/g, partner.products[Math.floor(Math.random() * partner.products.length)])
                            .replace(/\$\{event\}/g, monthEvent);
                        
                        if (customTheme) {
                            content += `\n\n💡 ${customTheme}`;
                        }
                        
                        generatedContent.push({
                            date: date.toISOString().split('T')[0],
                            type: contentType,
                            partner: partner.name,
                            content: content
                        });
                    }
                    
                    displayOutput();
                    showStatus(`✅ 成功生成 ${generatedContent.length} 篇內容！`, 'success');
                } catch (error) {
                    showStatus(`❌ 生成失敗: ${error.message}`, 'error');
                } finally {
                    document.getElementById('generateBtn').disabled = false;
                }
            }, 300);
        }
        
        function displayOutput() {
            const output = generatedContent.map(item => 
                `【${item.date}】${item.type.toUpperCase()}\n夥伴: ${item.partner}\n\n${item.content}\n\n${'─'.repeat(60)}\n`
            ).join('\n');
            
            const box = document.getElementById('outputBox');
            box.textContent = output;
            box.classList.remove('empty');
        }
        
        function copyOutput() {
            const output = document.getElementById('outputBox').textContent;
            if (output === '選擇設定後按「生成內容」開始...') {
                showStatus('❌ 還沒有內容可複製', 'error');
                return;
            }
            navigator.clipboard.writeText(output);
            showStatus('✅ 已複製到剪貼簿', 'success');
        }
        
        function exportCSV() {
            if (generatedContent.length === 0) {
                showStatus('❌ 還沒有內容可匯出', 'error');
                return;
            }
            
            const csv = [
                ['日期', '類型', '夥伴', '內容'].join(','),
                ...generatedContent.map(item => [
                    item.date,
                    item.type,
                    item.partner,
                    `"${item.content.replace(/"/g, '""')}"`
                ].join(','))
            ].join('\n');
            
            downloadFile(csv, `reels-content-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
        }
        
        function downloadJSON() {
            if (generatedContent.length === 0) {
                showStatus('❌ 還沒有內容可下載', 'error');
                return;
            }
            
            const json = JSON.stringify(generatedContent, null, 2);
            downloadFile(json, `reels-content-${new Date().toISOString().split('T')[0]}.json`, 'application/json');
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            showStatus(`✅ 已下載 ${filename}`, 'success');
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status-message ${type}`;
            statusEl.innerHTML = message;
        }
        
        function clearAll() {
            document.querySelectorAll('input[type="checkbox"]').forEach(e => e.checked = false);
            document.getElementById('contentType').value = 'reels';
            document.getElementById('daysRange').value = '7';
            document.getElementById('customTheme').value = '';
            document.getElementById('outputBox').textContent = '選擇設定後按「生成內容」開始...';
            document.getElementById('outputBox').classList.add('empty');
            document.getElementById('statusMessage').textContent = '';
            setDefaultDate();
            generatedContent = [];
            showStatus('✅ 已重設所有設定', 'success');
        }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
