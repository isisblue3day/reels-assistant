<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reels AI 內容助理 - 範本版</title>
  <style>
    :root{--navy:#10253f;--teal:#007f7a;--mint:#dff5ec;--cream:#f7f4ee;--ink:#17202a;--line:#dce1e4;--soft:#eef7f6}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--cream);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    .app{max-width:1200px;margin:auto;padding:24px}
    h1{font-size:24px;color:var(--navy);margin-bottom:8px}
    p{font-size:13px;color:#666;margin-bottom:20px}
    .layout{display:grid;grid-template-columns:300px 1fr;gap:20px}
    .panel,.main{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--line)}
    .panel{height:fit-content;position:sticky;top:20px}
    label{display:block;font-size:12px;font-weight:700;margin:12px 0 4px;color:#555;text-transform:uppercase}
    input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:8px}
    textarea{resize:vertical;min-height:60px}
    button{width:100%;padding:10px;border:0;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;margin-bottom:8px;transition:0.2s}
    button.primary{background:var(--teal);color:#fff}
    button.primary:hover{background:#006460}
    button.primary:disabled{opacity:0.5;cursor:not-allowed}
    button.secondary{background:#f0f0f0;color:var(--navy)}
    button.secondary:hover{background:#e0e0e0}
    .tabs{display:flex;gap:8px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
    .tab{padding:8px 12px;background:transparent;border:none;cursor:pointer;font-weight:600;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
    .tab.active{color:var(--teal);border-bottom-color:var(--teal)}
    .view{display:none}
    .view.active{display:block}
    .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .day{border:1px solid var(--line);padding:12px;border-radius:8px;background:#f9f9f9;min-height:120px;font-size:12px;cursor:pointer;transition:all 0.2s}
    .day:hover{border-color:var(--teal);box-shadow:0 0 8px rgba(0,127,122,0.1)}
    .day-num{font-weight:700;color:var(--teal);font-size:13px}
    .day-date{font-size:11px;color:#666;margin:4px 0}
    .day-title{font-weight:600;margin:6px 0 3px;line-height:1.3;color:var(--navy);font-size:12px}
    .day-cat{font-size:11px;color:#888}
    .day-fest{font-size:10px;background:#ffe0e0;color:#c00;padding:2px 4px;border-radius:3px;display:inline-block;margin-bottom:4px}
    .alert{padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}
    .alert-ok{background:#d4efeb;color:#05635e;border:1px solid #80d4cc}
    .list-item{padding:10px;border-left:3px solid var(--teal);background:#f9f9f9;margin-bottom:8px;border-radius:4px;font-size:13px}
    .list-item-date{font-weight:700;color:var(--navy);font-size:12px}
    .list-item-title{margin-top:4px;color:#555;line-height:1.4}
    pre{background:#f5f5f5;padding:12px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word;font-size:12px;line-height:1.6;font-family:monospace}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{position:static}.grid-5{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:600px){.grid-5{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <h1>🎬 Reels AI 內容助理 - 智能範本版</h1>
  <p>人與地球優選市集｜30 天內容日曆（無需 API，立即使用）</p>

  <div class="layout">
    <div class="panel">
      <h2>⚙️ 設定</h2>
      
      <label>帳號名稱</label>
      <input id="account" value="人與地球優選市集">
      
      <label>目標受眾</label>
      <textarea id="audience">25–45 歲重視質感、送禮心意與永續生活的都會消費者</textarea>
      
      <label>內容主軸（逗號分隔）</label>
      <textarea id="pillars">永續好物選品與開箱,社企品牌故事,DEI共融與支持特殊需求社群,節慶送禮與企業採購提案</textarea>
      
      <label>首發日期</label>
      <input id="startDate" type="date">
      
      <button class="primary" id="generateBtn">📋 生成 30 天日曆</button>
      <button class="secondary" id="exportBtn">💾 匯出 CSV</button>
      <button class="secondary" id="copyBtn">📋 複製全部</button>
    </div>

    <div class="main">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'calendar')">📅 日曆</button>
        <button class="tab" onclick="switchTab(this, 'script')">📝 腳本</button>
        <button class="tab" onclick="switchTab(this, 'schedule')">🗓 排程</button>
        <button class="tab" onclick="switchTab(this, 'events')">🌐 時事</button>
        <button class="tab" onclick="switchTab(this, 'drafts')">📸 草稿</button>
      </div>

      <div id="calendar" class="view active">
        <div class="grid-5" id="calendarGrid">
          <div style="grid-column:1/-1;text-align:center;color:#999;padding:40px">點擊「📋 生成 30 天日曆」開始</div>
        </div>
      </div>

      <div id="script" class="view">
        <div id="scriptContent" style="text-align:center;color:#999;padding:40px">尚未生成</div>
      </div>

      <div id="schedule" class="view">
        <div id="scheduleContent" style="text-align:center;color:#999;padding:40px">尚未生成</div>
      </div>

      <div id="events" class="view">
        <div id="eventsContent" style="text-align:center;color:#999;padding:40px">尚未生成</div>
      </div>

      <div id="drafts" class="view">
        <div id="draftsContent" style="text-align:center;color:#999;padding:40px">尚未生成</div>
      </div>
    </div>
  </div>
</div>

<script>
const data = {
  posts: [],
  selectedIdx: 0
};

const festivals = {
  '2026-09-10': '🎐 中秋節',
  '2026-10-10': '🇹🇼 國慶日',
  '2026-11-11': '🛍 雙十一購物節',
  '2026-11-27': '🦃 感恩節',
  '2026-12-01': '🎄 聖誕季開幕',
  '2026-12-25': '🎅 聖誕節',
  '2027-01-01': '✨ 新年新氣象',
  '2027-02-01': '🧧 農曆新年',
  '2027-03-08': '👩 婦女節',
  '2027-04-04': '👶 兒童節',
  '2027-05-01': '⚙ 勞動節'
};

// 智能標題庫
const templates = [
  '選好禮，一起永續前行',
  '每一個選擇，都是愛地球的表現',
  '送禮不只是心意，更是對永續的承諾',
  '質感選品，溫暖送禮',
  '支持社企，從選禮開始',
  '好禮來自好故事',
  '永續好物，送出正向改變',
  '與其浪費，不如選好禮',
  '一起守護地球，從送禮開始',
  '社企好物，每一份都是愛',
  '選品如選人，看的是品質與故事',
  'DEI 共融，從一份禮物開始',
  '特殊需求社群的驕傲作品',
  '好禮背後的好故事',
  '永續生活，從送禮習慣改變',
  '品牌有溫度，選品更有意義',
  '支持在地，成就永續',
  '每一筆消費，都投票給你想要的世界',
  '質感生活，從選對禮物開始',
  '送禮等於送出希望',
];

function switchTab(btn, name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(name).classList.add('active');
}

function generate() {
  const startDate = document.getElementById('startDate').value;
  if (!startDate) {
    alert('請先設定首發日期');
    return;
  }

  const account = document.getElementById('account').value || '人與地球優選市集';
  const pillars = document.getElementById('pillars').value.split(',').map(p => p.trim()).filter(p => p);
  
  if (pillars.length === 0) {
    alert('請填入內容主軸');
    return;
  }

  data.posts = [];
  const start = new Date(startDate + 'T00:00:00');

  for (let i = 0; i < 30; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);
    const dateStr = date.toISOString().slice(0, 10);
    
    const pillar = pillars[i % pillars.length];
    const fest = festivals[dateStr];
    const template = templates[i % templates.length];

    // 根據節慶或主軸變化標題
    let title = template;
    if (fest) {
      title = `${fest.substring(2)}：${template}`;
    } else if (pillar.includes('節慶')) {
      title = template;
    } else if (pillar.includes('DEI')) {
      title = `DEI 共融時刻：${template}`;
    } else if (pillar.includes('社企')) {
      title = `社企故事：${template}`;
    }

    data.posts.push({
      day: i + 1,
      date: dateStr,
      title: title.substring(0, 60),
      pillar,
      festival: fest || ''
    });
  }

  renderAll();
  alert(`✅ 已生成 30 天內容日曆！`);
}

function renderAll() {
  renderCalendar();
  renderScript();
  renderSchedule();
  renderEvents();
  renderDrafts();
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = data.posts.map((p, idx) => `
    <div class="day" onclick="data.selectedIdx = ${idx}; switchTab(document.querySelectorAll('.tab')[1], 'script')">
      <div class="day-num">Day ${p.day}</div>
      <div class="day-date">${p.date}</div>
      ${p.festival ? `<div class="day-fest">${p.festival.split(' ')[0]}</div>` : ''}
      <div class="day-title">${p.title}</div>
      <div class="day-cat">${p.pillar}</div>
    </div>
  `).join('');
}

function renderScript() {
  const cont = document.getElementById('scriptContent');
  if (data.posts.length === 0) {
    cont.innerHTML = '<div style="text-align:center;color:#999;padding:40px">尚未生成</div>';
    return;
  }

  const p = data.posts[data.selectedIdx || 0];
  const script = `【日期】
${p.date}

【標題】
${p.title}

【CTA】
馬上送禮 🎁

【腳本】
1️⃣ 開頭 3 秒吸睛
   展示產品或場景

2️⃣ 中段 5 秒說故事
   品牌價值 + ${p.pillar}

3️⃣ 結尾 2 秒行動
   馬上送禮 👉

【貼文文案】
${p.title}

在「人與地球優選市集」，每一個選擇都是永續的實踐。

立即選購，一起守護地球 💚`;

  cont.innerHTML = `
    <select onchange="data.selectedIdx = this.value; renderScript()" style="width:100%;margin-bottom:12px;padding:8px;border:1px solid #ddd;border-radius:6px">
      ${data.posts.map((post, i) => `<option value="${i}">${post.date} - ${post.title.substring(0, 20)}</option>`).join('')}
    </select>
    <pre>${script}</pre>
    <button class="secondary" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent); alert('✓ 已複製腳本')">📋 複製腳本</button>
  `;
}

function renderSchedule() {
  const cont = document.getElementById('scheduleContent');
  if (data.posts.length === 0) {
    cont.innerHTML = '<div style="text-align:center;color:#999;padding:40px">尚未生成</div>';
    return;
  }

  cont.innerHTML = `<div class="alert alert-ok">共排定 ${data.posts.length} 篇，建議每日 20:30 發布</div>` +
    data.posts.map(p => `
      <div class="list-item">
        <div class="list-item-date">${p.date} 20:30</div>
        <div class="list-item-title">📱 ${p.title}</div>
      </div>
    `).join('');
}

function renderEvents() {
  const cont = document.getElementById('eventsContent');
  if (data.posts.length === 0) {
    cont.innerHTML = '<div style="text-align:center;color:#999;padding:40px">尚未生成</div>';
    return;
  }

  const fests = data.posts.filter(p => p.festival);
  cont.innerHTML = `<div class="alert alert-ok">共 ${fests.length} 個節慶時事</div>` +
    (fests.length > 0 
      ? fests.map(p => `
          <div class="list-item">
            <div class="list-item-date">${p.date}</div>
            <div class="list-item-title">${p.festival}</div>
            <div style="font-size:11px;color:#888;margin-top:4px">主軸: ${p.pillar}</div>
          </div>
        `).join('')
      : '<div style="text-align:center;padding:20px;color:#999">無節慶</div>');
}

function renderDrafts() {
  const cont = document.getElementById('draftsContent');
  if (data.posts.length === 0) {
    cont.innerHTML = '<div style="text-align:center;color:#999;padding:40px">尚未生成</div>';
    return;
  }

  cont.innerHTML = '<div class="alert alert-ok">近 5 天預覽</div>' +
    data.posts.slice(0, 5).map((p, i) => `
      <div class="list-item">
        <div class="list-item-date">Day ${i + 1} - ${p.date}</div>
        <div class="list-item-title">${p.title}</div>
      </div>
    `).join('');
}

function exportCSV() {
  if (data.posts.length === 0) {
    alert('請先生成內容');
    return;
  }

  const csv = [
    ['日期', '標題', '分類'],
    ...data.posts.map(p => [p.date, `"${p.title}"`, p.pillar])
  ].map(row => row.join(',')).join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `reels-${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  alert('✅ CSV 已匯出');
}

function copyAll() {
  if (data.posts.length === 0) {
    alert('請先生成內容');
    return;
  }

  const text = data.posts.map((p, i) => `Day ${i + 1} (${p.date}): ${p.title}`).join('\n');
  navigator.clipboard.writeText(text);
  alert('✅ 已複製全部內容');
}

window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('startDate').value = today;
  
  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('exportBtn').addEventListener('click', exportCSV);
  document.getElementById('copyBtn').addEventListener('click', copyAll);
});
</script>
</body>
</html>
